<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egyptian Fast Service</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6}
header{background:#0f766e;color:#fff;padding:16px;text-align:center;font-weight:800;font-size:20px}
.container{max-width:520px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.hide{display:none!important}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:17px;font-weight:700;margin-top:10px;cursor:pointer}
button.sec{background:#e5e7eb;color:#111}
button.danger{background:#dc2626}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-top:8px;font-size:16px}
label{font-weight:700;display:block;margin-top:12px}
/* صفحة البداية */
#splash{padding:0;overflow:hidden;cursor:pointer}
#splash img{width:100%;height:420px;object-fit:cover;display:block}
#splash .splash-text{padding:20px;text-align:center}
#splash h1{margin:0;font-size:26px}
#splash p{color:#555;line-height:1.7}
#splash .tap{margin-top:10px;background:#0f766e;color:#fff;padding:14px;border-radius:12px;font-weight:800;font-size:18px}
.item{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
.small{font-size:13px;color:#777}
.badge{background:#fef3c7;padding:4px 8px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
